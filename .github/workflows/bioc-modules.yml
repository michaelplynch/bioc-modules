name: Test repository_dispatch

on:
  repository_dispatch:
    types: [sync-module]

permissions:
  contents: write
  pull-requests: write

jobs:
  received:
    runs-on: ubuntu-latest

    steps:
      - name: Confirm dispatch
        run: |
          echo "Received dispatch event"

      - name: Confirm payload
        run: |
          echo "Package: ${{ github.event.client_payload.package }}"
          echo "Source repo: ${{ github.event.client_payload.source_repo }}"
          echo "SHA: ${{ github.event.client_payload.sha }}"
          echo "Event type: ${{ github.event.action }}"

      - name: Checkout bioc-modules
        uses: actions/checkout@v4
        with:
          path: bioc-modules
      
      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.source_repo }}
          ref: ${{ github.event.client_payload.sha }}
          path: source-repo
      
      - name: Copy files into bioc-modules
        run: |
          MODULE_DIR="bioc-modules/modules/${{ github.event.client_payload.package }}"
          pwd
          ls -la
          mkdir -p "$MODULE_DIR/wrappers"
          rsync -av --delete \
            --include='*.nf' \
            ./wrappers/ \
            "$MODULE_DIR/"

      - name: Create metadata
        run: |
          cat > bioc-modules/modules/${{ github.event.client_payload.package }}/metadata.yaml << EOF
          package: ${{ github.event.client_payload.package }}
          version: ${{ github.event.client_payload.version }}
          source_repo: ${{ github.event.client_payload.source_repo }}
          sha: ${{ github.event.client_payload.sha }}
          synced_at: $(date -u +%FT%TZ)
          EOF

      - name: Show changes
        run: |
          cd bioc-modules
          git status
          git diff --stat || true

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          path: bioc-modules
          branch: sync-${{ github.event.client_payload.package }}
          delete-branch: true
          commit-message: |
            Sync ${{ github.event.client_payload.package }} ${{ github.event.client_payload.version }}
          title: |
            Sync ${{ github.event.client_payload.package }}
          body: |
            Automated sync from `${{ github.event.client_payload.source_repo }}`

            **Package:** ${{ github.event.client_payload.package }}
            **Version:** ${{ github.event.client_payload.version }}
            **SHA:** ${{ github.event.client_payload.sha }}

            Generated by repository_dispatch.
